<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><title>Crear torneo · Campeonatos</title></head><body class="saas-body"><header class="saas-nav"><a class="brand" href="inicio">⚽ CAMPEONATOS</a><nav><a href="cuenta">Mi cuenta</a></nav></header><main class="saas-shell narrow"><section class="wizard-card"><div class="eyebrow">NUEVO CAMPEONATO</div><h1>Registra tu torneo</h1><p>Completa los datos. Al final quedará pendiente de pago hasta confirmar los $20.</p><form autocomplete="off" id="tournamentForm"><div class="form-grid"><label>Nombre del torneo<input autocomplete="off" id="name" required placeholder="Ej. Campeonato Barrial 2026"></label><label>Temporada<input autocomplete="off" id="season" value="2026" required></label><label>País<select autocomplete="off" id="country"><option>Ecuador</option></select></label><label>Provincia<select autocomplete="off" id="province" required></select></label><label>Cantón<select autocomplete="off" id="canton" required></select></label><label>Parroquia<select autocomplete="off" id="parish" required></select></label><label>Descripción<textarea autocomplete="off" id="description" rows="4" placeholder="Información breve del campeonato"></textarea></label><label>Logo público (URL)<input autocomplete="off" id="logoUrl" type="url" placeholder="https://..."></label></div><div class="price-box"><div><span>Publicación del torneo</span><strong>$20.00</strong></div><small>Un pago por cada nuevo torneo. El torneo no se publica hasta confirmar el pago.</small></div><button class="primary-btn" type="submit">Guardar torneo y continuar al pago</button><div id="msg" class="form-msg"></div></form></section></main><script type="module" src="js/create-tournament.js"></script></body></html>

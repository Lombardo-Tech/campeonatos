<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso administrativo | Campeonato Institucional</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-shell">
  <div class="login-brand"><span class="brand-mark">⚽</span><div><b>CAMPEONATO</b><small>INSTITUCIONAL | EMPRESARIAL</small></div></div>
  <div class="login-card">
    <span class="kicker">TEMPORADA 2026</span>
    <h1>Acceso administrativo</h1>
    <p>Ingresa con una cuenta autorizada para gestionar el campeonato.</p>
    <form id="loginForm">
      <label>Correo electrónico<input id="email" type="email" autocomplete="username" required placeholder="admin@ejemplo.com"></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <button class="btn btn-primary login-btn">Ingresar al panel</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
  <a class="back-public" href="index.html">← Volver al campeonato</a>
</div>
<script type="module">
import { auth } from "./js/auth.js";
import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const form=document.getElementById("loginForm");
const error=document.getElementById("loginError");
onAuthStateChanged(auth,user=>{ if(user) location.href="admin.html"; });
form.addEventListener("submit",async e=>{
  e.preventDefault(); error.textContent="";
  try { await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value); }
  catch(err){ error.textContent="Correo o contraseña incorrectos."; }
});
</script>
</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Plataforma de Torneos</title><link rel="icon" href="img/favicon-32.png"><link rel="stylesheet" href="css/style.css"></head><body class="login-page"><div class="login-shell"><div class="login-brand"><span class="brand-mark login-mark">⚽</span><div><b>PLATAFORMA DE TORNEOS</b><small>CAMPEONATOS EN TIEMPO REAL</small></div></div><div class="login-card"><span class="kicker">PLATAFORMA MULTI-TORNEOS</span><h1>Acceso administrativo</h1><p>Ingresa con una cuenta autorizada para gestionar tus campeonatos.</p><form id="loginForm"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Ingresar</button><div id="loginMsg" class="msg"></div></form></div><a href="index.html" class="back-link">← Ver torneos públicos</a></div><script type="module">import {signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import {auth} from './js/firebase.js';const f=document.querySelector('#loginForm'),m=document.querySelector('#loginMsg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Ingresando...';try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value,document.querySelector('#password').value);location.href='admin.html';}catch(err){m.textContent='No se pudo iniciar sesión. Verifica tus datos.';}});</script></body></html>
